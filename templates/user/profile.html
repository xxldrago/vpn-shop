{% extends "base.html" %}
{% block content %}
<div class="page-title">Профиль</div>
<div class="page-sub">Редактирование личных данных и пароля.</div>

<div class="card" style="max-width:600px;">
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post" action="/dashboard/profile/save">
    <div class="form-group">
      <label>Логин (изменить нельзя)</label>
      <input class="form-control" value="{{ user.username }}" disabled>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input class="form-control" type="email" name="email" value="{{ user.email or '' }}">
    </div>
    <div class="form-group">
      <label>Telegram ник</label>
      <input class="form-control" name="telegram_id" value="{{ user.telegram_id or '' }}" placeholder="Например @username">
      <small class="muted">Укажите @ник для входа через бота</small>
    </div>
    <hr style="border-color:var(--glass-border); margin:20px 0;">
    <div class="card-sub mb-2">Смена пароля</div>
    <div class="form-group">
      <label>Текущий пароль</label>
      <div class="password-wrapper">
        <input class="form-control" type="password" name="current_password" id="current_password">
        <button type="button" class="password-toggle" data-target="current_password" aria-label="Показать пароль">
          <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <div class="form-group">
      <label>Новый пароль</label>
      <div class="password-wrapper">
        <input class="form-control" type="password" name="new_password" id="new_password">
        <button type="button" class="password-toggle" data-target="new_password" aria-label="Показать пароль">
          <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22"/></svg>
        </button>
      </div>
    </div>
    <button class="btn btn-primary" type="submit">Сохранить</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
document.querySelectorAll('.password-toggle').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var targetId = this.dataset.target;
    var input = document.getElementById(targetId);
    if (!input) return;
    var isHidden = input.type === 'password';
    input.type = isHidden ? 'text' : 'password';
    this.dataset.visible = isHidden ? 'true' : 'false';
  });
});
</script>
{% endblock %}
