# Amnezia Web Panel nginx site (frontend for panel.3set.online).
# Proxies public HTTPS -> local Amnezia panel on 127.0.0.1:5000.
#
# Replace __DOMAIN__ with your panel subdomain (e.g. panel.3set.online).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived connections (panel uses SSE/polling for async SSH probes)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
