# VpnShop nginx site.
# Place in /etc/nginx/sites-available/vpnshop and symlink into sites-enabled.
#
# Replace __DOMAIN__ with your domain (e.g. vpn.example.com).
# After HTTPS is issued by certbot this file is replaced with the
# certbot-generated http->https redirect + ssl server block.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Large uploads / webhook bodies
    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
